# Copy to rover.yaml in the directory you start the app from, or set ROVER_CONFIG.
# Paths are filesystem paths as seen by the app process.
# With Docker Compose, mount host repositories at /repos and use those container paths.
workspaces:
  - slug: fastcrib
    name: FastCrib
    repositories:
      - name: fastcrib
        path: /repos/fastcrib
        ignore_globs: []
        use_default_ignores: true
  - slug: pos
    name: POS
    repositories:
      - name: pos
        path: /repos/pos
        ignore_globs: []
        use_default_ignores: true
