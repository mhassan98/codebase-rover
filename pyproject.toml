[project]
name = "codebase-rover"
version = "0.1.0"
description = "Local-first codebase question answering and pull request review"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pathspec>=0.12",
    "pyyaml>=6",
    "tree-sitter>=0.24",
    "tree-sitter-language-pack>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
codebase-rover = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
